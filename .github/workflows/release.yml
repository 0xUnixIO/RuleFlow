name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-binaries:
    name: 构建二进制并发布
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"

      - name: 缓存 bun 依赖
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('web-ui/bun.lock') }}
          restore-keys: bun-

      - name: 构建前端
        run: cd web-ui && bun install --frozen-lockfile && bun run build

      - name: 构建二进制
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOFLAGS=-buildvcs=false \
            go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o ruleflow-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 GOFLAGS=-buildvcs=false \
            go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o ruleflow-linux-arm64 .
          sha256sum ruleflow-linux-amd64 ruleflow-linux-arm64 > checksums.txt

      - name: 上传二进制 artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            ruleflow-linux-amd64
            ruleflow-linux-arm64

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ruleflow-linux-amd64
            ruleflow-linux-arm64
            checksums.txt

  build-docker:
    name: 构建并推送 Docker 镜像
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载二进制 artifact
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: .

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/0xunixio/ruleflow:latest
            ghcr.io/0xunixio/ruleflow:${{ github.ref_name }}
