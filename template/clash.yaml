allow-lan: true
mode: Rule
external-controller: 127.0.0.1:7892
port: 7890
socks-port: 7891
ipv6: true
dns:
  enable: true
  ipv6: false
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  prefer-h3: true
  respect-rules: true
  use-hosts: false
  use-system-hosts: true
  fake-ip-filter:
    - +.lan
    - +.local
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://1.12.12.12/dns-query
    - https://223.5.5.5/dns-query
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    +.skk.moe: https://223.5.5.5/dns-query
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
tun:
  enable: true
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
proxies: []
proxy-groups:
  - name: 🏠 Home
    hidden: true
    type: select
    proxies:
      - __NODES__
    filter: wireguard-home
    url: http://cp.cloudflare.com/generate_204
  # - type: url-test
  #   hidden: true
  #   name: My_Relay
  #   url: http://cp.cloudflare.com/generate_204
  #   filter: (🇺🇸).*(LAX GIA)
  #   proxies:
  #     - __NODES__
  # - type: url-test
  #   hidden: true
  #   name: Need_Relay
  #   url: http://cp.cloudflare.com/generate_204
  #   filter: PA
  #   dialer-proxy: My_Relay
  #   proxies:
  #     - __NODES__
  - type: select
    name: 🚀 Proxy
    filter: "^(?!.*(?i)wireguard).*$"
    url: http://cp.cloudflare.com/generate_204
    proxies:
      - ⚡ Auto
      - 🇯🇵 JP
      - 🇺🇸 US
      - DIRECT
      - __NODES__
  - type: url-test
    name: ⚡ Auto
    filter: "^(?!.*(?i)wireguard).*$"
    proxies:
      - __NODES__
    url: http://cp.cloudflare.com/generate_204
    interval: 1200
  - type: url-test
    name: 🇺🇸 US
    filter: ^🇺🇸.*
    proxies:
      - __NODES__
    url: http://cp.cloudflare.com/generate_204
    interval: 1200
  - type: url-test
    name: 🇭🇰 HK
    filter: ^🇭🇰.*
    proxies:
      - __NODES__
    url: http://cp.cloudflare.com/generate_204
    interval: 1200
  - type: url-test
    name: 🇯🇵 JP
    filter: ^🇯🇵.*
    proxies:
      - __NODES__
    url: http://cp.cloudflare.com/generate_204
    interval: 1200
  - type: select
    name: 📺 Stream
    url: http://cp.cloudflare.com/generate_204
    proxies:
      - 🚀 Proxy
      - 🇺🇸 US
      - 🇯🇵 JP
      - 🇭🇰 HK
  - type: select
    name: 🤖 AI
    url: http://cp.cloudflare.com/generate_204
    filter: (?i)FRONTIER|HAWAII|AT&T|lumen|wave|pa
    proxies:
      - __NODES__
