🇨🇳 TW = url-test,__NODES__, url = http://cp.cloudflare.com/generate_204, interval = 1200,policy-regex-filter=TW
🎬 Stream = select,🇺🇸 US,🇯🇵 JP,🇭🇰 HK,🇨🇳 TW,🇸🇬 SG
🤖 AI = select,__NODES__, url = http://cp.cloudflare.com/generate_204, interval = 1200,policy-regex-filter=(?i)at&t|qqpw
🔗 relay =  url-test, __NODES__, url = http://cp.cloudflare.com/generate_204, interval = 1200, policy-regex-filter=MEGABOX
⚡️ landing = url-test, __NODES__, url = http://cp.cloudflare.com/generate_204, interval = 1200, policy-regex-filter=LAX4, dialer-proxy=🔗 relay

